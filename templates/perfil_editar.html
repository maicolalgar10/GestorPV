<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuración del Perfil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css  " rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css  " rel="stylesheet">
</head>
<body class="bg-light">
  {%include 'mensajes.html' %}

  <div class="container my-4">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <a href="{{ url_for('dashboard.dashboard') }}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Volver al Dashboard
      </a>
      <h3 class="fw-bold">⚙️ Configuración del Perfil</h3>
      <span></span> <!-- Espacio para alinear el botón -->
    </div>

    

    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card shadow-sm p-4">
          <form method="POST" action="{{ url_for('usuarios.configuracion_perfil') }}">
            <div class="mb-3">
              <label for="nombre" class="form-label fw-semibold">Nombre</label>
              <input type="text" class="form-control" id="nombre" name="nombre" value="{{ usuario.nombre }}" required>
            </div>

            <div class="mb-3">
              <label for="correo" class="form-label fw-semibold">Correo Electrónico</label>
              <input type="email" class="form-control" id="correo" name="correo" value="{{ usuario.email }}" required>
              <div class="form-text">Si cambias tu correo, deberás confirmar tu contraseña actual.</div>
            </div>

            <hr>

            <h5 class="mt-4">Cambiar Contraseña</h5>
            <p class="text-muted">Deja los campos vacíos si no deseas cambiar la contraseña.</p>

            <div class="mb-3">
              <label for="contrasena_actual" class="form-label">Contraseña Actual</label>
              <input type="password" class="form-control" id="contrasena_actual" name="contrasena_actual">
              <div class="form-text">Requerido si cambias el correo o la contraseña.</div>
            </div>

            <div class="mb-3">
              <label for="nueva_contrasena" class="form-label">Nueva Contraseña</label>
              <input type="password" class="form-control" id="nueva_contrasena" name="nueva_contrasena">
            </div>

            <div class="d-flex justify-content-end mt-4">
              <button type="submit" class="btn btn-primary">Guardar Cambios</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js  "></script>
</body>
</html>
