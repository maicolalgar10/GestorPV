<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .login-container {
            max-width: 400px;
            margin: 5% auto;
            padding: 2rem;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .logo img {
            border-radius: 15%;
            background: #f1f1f1;
            padding: 10px;
            
        }
        .btn-dark-custom {
            background-color: #111;
            color: #fff;
            border-radius: 10px;
            transition: background-color 0.3s ease-in-out;
        }
        .btn-dark-custom:hover {
            background-color: #333;
        }
        .form-control {
            border-radius: 10px;
        }
        .register-link {
            display: inline-block;
            margin-top: 10px;
            color: #111;
            font-weight: 500;
            text-decoration: none;
        }
        .register-link:hover {
            text-decoration: underline;
            color: #333;
        }
    </style>
</head>
<body>
  {% include 'mensajes.html' %}

<div class="login-container text-center">
    <div class="logo mb-3">
        <img src="{{ url_for('static', filename='../static/uploads/logos/corseing_logo.png') }}" alt="Logo" width="320" height="120">
    </div>

    <h3 class="fw-bold mb-3"><i class="bi bi-key-fill"></i> Iniciar Sesión</h3>

    

    <form method="post" class="login-form d-grid gap-3">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <input type="text" 
       name="contacto" 
       class="form-control" 
       placeholder="Teléfono o Email (Usuario)" 
       required>
               
        <input type="password" name="password" class="form-control" placeholder="Contraseña" required>
        <button type="submit" class="btn btn-dark-custom w-100">Ingresar</button>
    </form>

    <div class="mt-3">
        <a href="{{ url_for('usuarios.olvide_contrasena') }}" class="register-link">¿Olvidaste tu <b>Contraseña?</b></a>
    </div>
    <div class="text-center mt-3">
        <p>¿No tienes una cuenta? <a href="{{ url_for('usuarios.register') }}">Registrarse como Administrador</a></p>
    </div>
</div>

</body>
</html>
