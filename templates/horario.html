<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Hora de Entrada</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background-color: #f9fafb;
    }

    .card {
      border-radius: 15px;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
    }

    .form-label {
      font-weight: 600;
      color: #2d3748;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      font-weight: 600;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      border-radius: 8px;
    }

    h4 {
      font-weight: bold;
      color: #1a202c;
    }

    .readonly-input {
      background-color: #e9ecef;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  {% include 'mensajes.html' %}



  <div class="container my-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="mb-4"><i class="bi bi-clock"></i> Registrar Hora de Entrada</h4>

        <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <!-- Trabajador (solo lectura) -->
          <div class="mb-3">
            <label class="form-label">Trabajador</label>
            <input type="hidden" name="personal_id" value="{{ personal.id }}">
            <input type="text" class="form-control readonly-input" value="{{ personal.nombre }}" readonly>
          </div>

          <div class="row">
            <!-- Fecha -->
            <div class="col-md-6 mb-3">
              <label class="form-label">Fecha</label>
              <input type="date" class="form-control" name="fecha" value="{{ fecha_actual }}" required>
            </div>

            <!-- Proyecto -->
            <div class="col-md-6 mb-3">
              <label class="form-label">Proyecto</label>
              <select name="proyecto_id" class="form-select" required>
                <option value="">-- Seleccione un proyecto --</option>
                {% for pr in proyectos %}
                  <option value="{{ pr.id_proyecto }}">{{ pr.nombre }}</option>
                {% endfor %}
              </select>
            </div>
          </div>

          <!-- Hora de entrada -->
          <div class="mb-3">
            <label class="form-label">Hora de entrada</label>
            <input type="time" class="form-control" name="hora_entrada" required>
          </div>

          <!-- Observación -->
          <div class="mb-3">
            <label class="form-label">Observación (opcional)</label>
            <textarea class="form-control" name="observacion" rows="3"
              placeholder="Ej: Llegar puntual para reunión de arranque..."></textarea>
          </div>

          <!-- Botones -->
          <div class="d-flex justify-content-end gap-2">
            <a href="{{ url_for('personal.manage_personal') }}" class="btn btn-secondary">
              <i class="bi bi-x-circle"></i> Cancelar
            </a>
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-send"></i> Enviar
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
