<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Proyecto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">

  <div class="container my-5">
    <div class="card shadow-lg border-0">
      <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
        <h4 class="mb-0"><i class="bi bi-pencil-square"></i> Editar Proyecto</h4>
        <a href="{{ url_for('proyectos.manage_proyectos') }}" class="btn btn-outline-light btn-sm">
          <i class="bi bi-arrow-left"></i> Volver
        </a>
      </div>

      <div class="card-body">
        <form method="POST" action="{{ url_for('proyectos.editar_proyecto', id_proyecto=proyecto.id_proyecto) }}">
          <div class="row g-3">

            <!-- Nombre -->
            <div class="col-md-6">
              <label class="form-label fw-semibold">Nombre del Proyecto</label>
              <input type="text" class="form-control" name="nombre" value="{{ proyecto.nombre }}" required>
            </div>

            <!-- Lugar -->
            <div class="col-md-6">
              <label class="form-label fw-semibold">Lugar</label>
              <input type="text" class="form-control" name="lugar" value="{{ proyecto.lugar }}" required>
            </div>

            <!-- Responsable -->
            <div class="col-md-6">
              <label class="form-label fw-semibold">Responsable</label>
              <select class="form-select" name="responsable_id" required>
                {% for p in personal %}
                <option value="{{ p.id }}" {% if p.id==proyecto.responsable_id %}selected{% endif %}>{{ p.nombre }}
                </option>
                {% endfor %}
              </select>
            </div>

            <!-- Estado -->
            <div class="col-md-6">
              <label class="form-label fw-semibold">Estado</label>
              <select class="form-select" name="estado">
                <option value="Pendiente" {% if proyecto.estado=="PENDIENTE" %}selected{% endif %}>Pendiente</option>
                <option value="En Progreso" {% if proyecto.estado=="EN_PROGRESO" %}selected{% endif %}>En progreso
                </option>
                <option value="Finalizado" {% if proyecto.estado=="FINALIZADO" %}selected{% endif %}>Finalizado</option>
              </select>
            </div>

            <!-- Fechas -->
            <div class="col-md-6">
              <label class="form-label fw-semibold">Fecha de Inicio</label>
              <input type="date" class="form-control" name="fecha_inicio"
                value="{{ proyecto.fecha_inicio.strftime('%Y-%m-%d') }}" required>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Fecha de Fin</label>
              <input type="date" class="form-control" name="fecha_fin"
                value="{{ proyecto.fecha_fin.strftime('%Y-%m-%d') }}" required>
            </div>

            <!-- Descripción -->
            <div class="col-12">
              <label class="form-label fw-semibold">Descripción</label>
              <textarea class="form-control" name="descripcion" rows="3">{{ proyecto.descripcion }}</textarea>
            </div>

            <!-- Personal asignado -->
            <div class="col-md-6">
              <label class="form-label fw-semibold">Personal asignado</label>
              <select multiple class="form-select" name="personal_id" id="personalAdicionalSelect">
                {% for p in personal %}
                <option value="{{ p.id }}" {% if p.id in personal_asignado_ids or p.id==proyecto.responsable_id
                  %}selected{% endif %} {% if p.id==proyecto.responsable_id %}disabled{% endif %}>
                  {{ p.nombre }}
                </option>
                {% endfor %}
              </select>
              <small class="text-muted">Usa CTRL o CMD para seleccionar varios.</small>
            </div>

            <!-- Vehículos -->
            <div class="col-md-6">
              <label class="form-label fw-semibold">Vehículos asignados</label>
              <select multiple class="form-select" name="vehiculo_id">
                {% for v in vehiculos %}
                <option value="{{ v.id_vehiculo }}" {% if v.id_vehiculo in vehiculos_asignados_ids %}selected{% endif
                  %}>
                  {{ v.placa }}
                </option>
                {% endfor %}
              </select>
            </div>
          </div>

      </div>
    </div>
  </div>

  </div>

  <div class="d-flex justify-content-end mt-4">
    <button type="submit" class="btn btn-success px-4"><i class="bi bi-check-lg"></i> Guardar cambios</button>
    <a href="{{ url_for('proyectos.manage_proyectos') }}" class="btn btn-secondary ms-2">Cancelar</a>
  </div>
  <input type="hidden" name="personal_id" value="">
  </form>
  </div>
  </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('.material-checkbox').forEach(function (cb) {
        cb.addEventListener('change', function () {
          const id = this.getAttribute('data-id');
          const qty = document.querySelector('.cantidad-input[data-id="' + id + '"]');
          if (!qty) return;
          if (this.checked) {
            qty.removeAttribute('disabled');
            qty.focus();
          } else {
            qty.value = '';
            qty.setAttribute('disabled', 'disabled');
          }
        });
      });
    });
  </script>
</body>

</html>
