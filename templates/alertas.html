<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Alertas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
      {% include 'mensajes.html' %}

<div class="container my-4">
    <h2 class="mb-4 text-danger"><i class="bi bi-exclamation-triangle-fill"></i> Gestión de Alertas</h2>

    <!-- Formulario -->
    <form method="POST" class="card p-3 shadow mb-4">
        <h5>Nueva Alerta</h5>
        <div class="row g-2">
            <div class="col-md-4">
                <input type="text" name="tipo" placeholder="Tipo" class="form-control" required>
            </div>
            <div class="col-md-4">
                <input type="text" name="mensaje" placeholder="Mensaje" class="form-control" required>
            </div>
            <div class="col-md-4">
                <input type="number" name="proyecto_id" placeholder="ID Proyecto (opcional)" class="form-control">
            </div>
        </div>
        <button class="btn btn-danger mt-3">Agregar</button>
    </form>

    <!-- Lista -->
    <div class="card shadow">
        <div class="card-body">
            {% if alertas %}
            <ul class="list-group">
                {% for a in alertas %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <div>
                        <strong>{{ a.tipo }}</strong>: {{ a.mensaje }}
                        {% if a.proyecto %}
                            <span class="badge bg-primary">Proyecto: {{ a.proyecto.nombre }}</span>
                        {% endif %}
                    </div>
                    <a href="{{ url_for('delete_alerta', id=a.id) }}" class="btn btn-sm btn-danger">Eliminar</a>
                </li>
                {% endfor %}
            </ul>
            {% else %}
                <p class="text-muted">No hay alertas registradas.</p>
            {% endif %}
        </div>
    </div>
</div>
</body>
</html>
