<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cambiar Contraseña</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    {%include 'mensajes.html' %}

  <div class="container mt-5">
    <div class="card shadow-sm p-4 mx-auto" style="max-width: 450px;">
      <h4 class="mb-3 text-center"><i class="bi bi-lock-fill"></i> Cambiar Contraseña</h4>

      

      <form method="POST" action="{{ url_for('usuarios.cambiar_password', token=usuario.reset_token) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div class="mb-3">
          <label class="form-label">Nueva contraseña</label>
          <input type="password" name="nueva_pass" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Confirmar contraseña</label>
          <input type="password" name="confirmar_pass" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-dark w-100">Actualizar</button>
      </form>
    </div>
  </div>
</body>
</html>
