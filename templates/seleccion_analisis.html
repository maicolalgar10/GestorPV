<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Selector de Análisis | Gestión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url("{{ url_for('static', filename='img/fondo.jpg') }}");
            background-size: cover; background-attachment: fixed; min-height: 100vh; color: white;
        }
        .project-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            border-radius: 15px;
        }
        .project-card:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-5px);
            border-color: #0dcaf0;
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="text-center mb-5">
        <h1 class="fw-bold"><i class="bi bi-search-heart me-2"></i>Análisis de Materiales</h1>
        <p class="lead">Selecciona un proyecto para comparar el presupuesto vs. el gasto real</p>
        <a href="{{ url_for('dashboard.dashboard') }}" class="btn btn-outline-light btn-sm">Volver al Dashboard</a>
    </div>

    <div class="row g-4">
        {% for p in proyectos %}
        <div class="col-md-4">
            <div class="card project-card h-100 text-white" onclick="window.location.href='{{ url_for('avances.analisis_comparativo', id_proyecto=p.id_proyecto) }}'">
                <div class="card-body text-center">
    <div class="display-6 mb-3 text-info"><i class="bi bi-building"></i></div>
    <h5 class="card-title fw-bold">{{ p.nombre }}</h5>
    <p class="card-text small opacity-75">{{ p.lugar or 'Sin ubicación' }}</p>
    <div class="mt-3">
        <span class="badge bg-info text-dark">Ver Comparativa →</span>
    </div>
</div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
</body>
</html>
