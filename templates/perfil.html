<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editar Perfil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
  <div class="card shadow-sm p-4 mx-auto" style="max-width: 500px;">
    <h4 class="mb-3">Editar Perfil</h4>
    <div class="text-center mb-3">
      <img src="{{ url_for('static', filename=usuario.foto_perfil or 'uploads/perfiles/default.png') }}"
           class="rounded-circle"
           width="120" height="120"
           style="object-fit: cover;">
    </div>
    <form method="POST" enctype="multipart/form-data">
      <div class="mb-3">
        <label for="foto" class="form-label">Subir nueva foto de perfil</label>
        <input class="form-control" type="file" id="foto" name="foto" accept="image/*">
      </div>
      <button type="submit" class="btn btn-primary">Guardar cambios</button>
      <a href="{{ url_for('dashboard.home') }}" class="btn btn-secondary">Cancelar</a>
    </form>
  </div>
</div>

</body>
</html>
