<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil - CORSEING</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --corseing-green: #00b050;
      --corseing-dark-green: #008c3d;
      --corseing-yellow: #ffd700;
      --corseing-dark-gray: #2d3436;
      --corseing-light-gray: #f5f6fa;
    }

    body {
      background: linear-gradient(135deg, var(--corseing-green) 0%, var(--corseing-dark-green) 100%);
      min-height: 100vh;
      padding: 2rem 0;
      position: relative;
      overflow-x: hidden;
    }

    /* Decoración de fondo con líneas diagonales */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      right: -10%;
      width: 80%;
      height: 200%;
      background: linear-gradient(45deg, 
        transparent 30%, 
        rgba(255, 215, 0, 0.1) 30%, 
        rgba(255, 215, 0, 0.1) 35%, 
        transparent 35%);
      transform: rotate(-15deg);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
    }

    .profile-card {
      background: white;
      border-radius: 25px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      max-width: 650px;
      margin: 0 auto;
      border: 3px solid var(--corseing-yellow);
    }

    .profile-header {
      background: linear-gradient(135deg, var(--corseing-green) 0%, var(--corseing-dark-green) 100%);
      padding: 2.5rem 2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Decoración de engranaje en el header */
    .profile-header::before {
      content: '⚙️';
      position: absolute;
      top: -20px;
      right: -20px;
      font-size: 8rem;
      opacity: 0.1;
      transform: rotate(15deg);
    }

    .profile-header::after {
      content: '📐';
      position: absolute;
      bottom: -30px;
      left: -30px;
      font-size: 6rem;
      opacity: 0.1;
      transform: rotate(-25deg);
    }

    .profile-header h4 {
      color: white;
      margin: 0;
      font-weight: 700;
      font-size: 1.6rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
    }

    .company-subtitle {
      color: var(--corseing-yellow);
      font-size: 0.9rem;
      font-weight: 600;
      margin-top: 0.3rem;
      letter-spacing: 2px;
    }

    .profile-avatar-container {
      position: relative;
      display: inline-block;
      margin-top: 1.5rem;
    }

    .profile-avatar {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 5px solid var(--corseing-yellow);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      object-fit: cover;
      transition: all 0.3s ease;
      background: white;
    }

    .profile-avatar:hover {
      transform: scale(1.05);
      border-color: white;
    }

    .avatar-overlay {
      position: absolute;
      bottom: 5px;
      right: 5px;
      background: linear-gradient(135deg, var(--corseing-yellow) 0%, #ffed4e 100%);
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--corseing-dark-gray);
      font-size: 1.3rem;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      transition: all 0.3s ease;
      border: 3px solid white;
    }

    .avatar-overlay:hover {
      background: linear-gradient(135deg, #ffed4e 0%, var(--corseing-yellow) 100%);
      transform: scale(1.15) rotate(15deg);
    }

    .profile-body {
      padding: 2.5rem;
      background: linear-gradient(to bottom, #ffffff 0%, #f8f9fa 100%);
    }

    .user-info {
      text-align: center;
      margin-bottom: 2rem;
      padding: 1.5rem;
      background: white;
      border-radius: 15px;
      border-left: 5px solid var(--corseing-green);
      box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
    }

    .user-name {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--corseing-dark-gray);
      margin-bottom: 0.5rem;
    }

    .user-email {
      color: #718096;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .user-email i {
      color: var(--corseing-green);
    }

    .form-label {
      font-weight: 700;
      color: var(--corseing-dark-gray);
      margin-bottom: 0.8rem;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-label i {
      color: var(--corseing-green);
    }

    .file-input-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
      width: 100%;
    }

    .file-input-wrapper input[type=file] {
      position: absolute;
      left: -9999px;
    }

    .file-input-label {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.3rem;
      background: white;
      border: 3px dashed var(--corseing-green);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      color: var(--corseing-dark-gray);
      font-weight: 600;
    }

    .file-input-label:hover {
      background: #f0fdf4;
      border-color: var(--corseing-dark-green);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 176, 80, 0.2);
    }

    .file-input-label i {
      font-size: 1.8rem;
      margin-right: 0.8rem;
      color: var(--corseing-green);
    }

    .selected-file {
      margin-top: 0.8rem;
      padding: 0.8rem;
      background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
      border-radius: 8px;
      border-left: 4px solid var(--corseing-green);
      color: #155724;
      font-size: 0.9rem;
      font-weight: 600;
      display: none;
    }

    .selected-file i {
      color: var(--corseing-green);
      font-size: 1.1rem;
    }

    .btn-save {
      background: linear-gradient(135deg, var(--corseing-green) 0%, var(--corseing-dark-green) 100%);
      border: none;
      padding: 0.9rem 2.5rem;
      border-radius: 12px;
      color: white;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      box-shadow: 0 5px 20px rgba(0, 176, 80, 0.4);
      position: relative;
      overflow: hidden;
    }

    .btn-save::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    .btn-save:hover::before {
      width: 300px;
      height: 300px;
    }

    .btn-save:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 176, 80, 0.5);
    }

    .btn-cancel {
      background: linear-gradient(135deg, var(--corseing-yellow) 0%, #ffed4e 100%);
      border: 2px solid var(--corseing-dark-gray);
      padding: 0.9rem 2.5rem;
      border-radius: 12px;
      color: var(--corseing-dark-gray);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
    }

    .btn-cancel:hover {
      background: linear-gradient(135deg, #ffed4e 0%, var(--corseing-yellow) 100%);
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(255, 215, 0, 0.4);
    }

    .action-buttons {
      display: flex;
      gap: 1rem;
      margin-top: 2.5rem;
    }

    .action-buttons button,
    .action-buttons a {
      flex: 1;
      position: relative;
      z-index: 1;
    }

    /* Detalles decorativos de ingeniería */
    .engineering-detail {
      position: absolute;
      opacity: 0.05;
      font-size: 4rem;
      color: var(--corseing-green);
    }

    .engineering-detail.top-right {
      top: 20px;
      right: 20px;
    }

    .engineering-detail.bottom-left {
      bottom: 20px;
      left: 20px;
    }

    @media (max-width: 576px) {
      .profile-body {
        padding: 1.5rem;
      }
      
      .action-buttons {
        flex-direction: column;
      }

      .profile-avatar {
        width: 130px;
        height: 130px;
      }
    }
  </style>
</head>
<body>
  {% include 'mensajes.html' %}

<div class="container">
  <div class="profile-card">
    <!-- Header con avatar -->
    <div class="profile-header">
      <h4><i class="bi bi-person-badge me-2"></i>Mi Perfil</h4>
      <div class="company-subtitle">CORSEING</div>
      <div class="profile-avatar-container">
        <img src="{{ session.get('foto_perfil', usuario.foto_perfil or '/static/uploads/perfiles/default.png') }}"
            class="profile-avatar"
            id="preview-avatar"
            alt="Foto de perfil">
        <label for="foto" class="avatar-overlay" title="Cambiar foto">
          <i class="bi bi-camera-fill"></i>
        </label>
      </div>
    </div>

    <!-- Body con información -->
    <div class="profile-body">
      <i class="bi bi-gear-fill engineering-detail top-right"></i>
      <i class="bi bi-tools engineering-detail bottom-left"></i>

      <div class="user-info">
        <div class="user-name">{{ usuario.nombre }}</div>
        <div class="user-email">
          <i class="bi bi-envelope-fill"></i>
          <span>{{ usuario.email }}</span>
        </div>
      </div>

      <form method="POST" enctype="multipart/form-data" id="profileForm">
        <div class="mb-4">
          <label for="foto" class="form-label">
            <i class="bi bi-image-fill me-2"></i>Cambiar foto de perfil
          </label>
          <div class="file-input-wrapper">
            <input class="form-control" 
                   type="file" 
                   id="foto" 
                   name="foto" 
                   accept="image/*"
                   onchange="handleFileSelect(event)">
            <label for="foto" class="file-input-label">
              <i class="bi bi-cloud-upload-fill"></i>
              <span>Seleccionar nueva imagen</span>
            </label>
          </div>
          <div class="selected-file" id="selectedFile">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span id="fileName"></span>
          </div>
        </div>

        <div class="action-buttons">
          <button type="submit" class="btn btn-save">
            <i class="bi bi-save-fill me-2"></i>Guardar
          </button>
          <a href="{{ url_for('dashboard.dashboard') }}" class="btn btn-cancel">
            <i class="bi bi-x-circle-fill me-2"></i>Cancelar
          </a>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  function handleFileSelect(event) {
    const file = event.target.files[0];
    if (file) {
      // Validar que sea una imagen
      if (!file.type.startsWith('image/')) {
        alert('Por favor selecciona un archivo de imagen válido');
        return;
      }

      // Validar tamaño (máximo 5MB)
      if (file.size > 5 * 1024 * 1024) {
        alert('La imagen no debe superar los 5MB');
        return;
      }

      // Mostrar nombre del archivo
      document.getElementById('fileName').textContent = file.name;
      document.getElementById('selectedFile').style.display = 'block';
      
      // Preview de la imagen con animación
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = document.getElementById('preview-avatar');
        img.style.opacity = '0.5';
        setTimeout(() => {
          img.src = e.target.result;
          img.style.opacity = '1';
        }, 200);
      }
      reader.readAsDataURL(file);
    }
  }

  // Prevenir envío del formulario si no hay archivo seleccionado
  document.getElementById('profileForm').addEventListener('submit', function(e) {
    const fileInput = document.getElementById('foto');
    if (!fileInput.files || fileInput.files.length === 0) {
      e.preventDefault();
      alert('Por favor selecciona una imagen antes de guardar');
    }
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
