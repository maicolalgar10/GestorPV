<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Administrador - ICC SAS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .login-container {
            max-width: 400px;
            margin: 5% auto;
            padding: 2rem;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .btn-dark-custom {
            background-color: #111;
            color: #fff;
            border-radius: 10px;
            transition: background-color 0.3s ease-in-out;
        }
        .btn-dark-custom:hover {
            background-color: #333;
        }
        .form-control {
            border-radius: 10px;
        }
    </style>
</head>
<body>
  {% include 'mensajes.html' %}

<div class="login-container text-center">
    <h3 class="fw-bold mb-3"><i class="bi bi-person-plus-fill"></i> Crear Administrador</h3>
    <p class="text-muted">Registro exclusivo ICC-SAS</p>

    <form method="post" class="login-form d-grid gap-3">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        
        <input type="text" 
               name="nombre" 
               class="form-control" 
               placeholder="Nombre completo" 
               required>

        <input type="email" 
               name="email" 
               class="form-control" 
               placeholder="Correo Electrónico" 
               required>
               
        <input type="password" 
               name="password" 
               class="form-control" 
               placeholder="Contraseña" 
               required>
               
        <button type="submit" class="btn btn-dark-custom w-100">Registrar Admin</button>
    </form>
    
    <div class="mt-3">
        <a href="{{ url_for('usuarios.login') }}" class="text-muted" style="text-decoration: none;">← Volver al login</a>
    </div>
</div>

</body>
</html>
