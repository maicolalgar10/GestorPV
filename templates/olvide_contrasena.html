<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .register-container {
            max-width: 450px;
            margin: 5% auto;
            padding: 2rem;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .logo img {
            border-radius: 50%;
            background: #f1f1f1;
            padding: 10px;
        }
        .btn-dark-custom {
            background-color: #111;
            color: #fff;
            border-radius: 10px;
            transition: background-color 0.3s ease-in-out;
        }
        .btn-dark-custom:hover {
            background-color: #333;
        }
        .form-control {
            border-radius: 10px;
        }
        .login-link {
            display: inline-block;
            margin-top: 10px;
            color: #111;
            font-weight: 500;
            text-decoration: none;
        }
        .login-link:hover {
            text-decoration: underline;
            color: #333;
        }
    </style>
</head>
<body>

<div class="register-container text-center">
    <div class="logo mb-3">
        <img src="{{ url_for('static', filename='../static/uploads/logos/corseing_logo.png') }}" alt="Logo" width="120" height="120">
    </div>

    <h3 class="fw-bold mb-3">¿OLVIDASTE TU CONTRASEÑA?</h3>
    <p class="text-muted mb-4">Ingresa tu correo y te enviaremos un enlace para restablecerla.</p>

    <!-- Mensajes flash -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <!-- Formulario de recuperación -->
    <form method="post" class="register-form d-grid gap-3">
        <input type="email" name="email" class="form-control" placeholder="Correo electrónico" required>
        <button type="submit" class="btn btn-dark-custom w-100">Enviar enlace</button>
    </form>

    <div class="mt-3">
        <a href="{{ url_for('usuarios.login') }}" class="login-link">Volver al inicio de sesión</a>
    </div>
</div>

</body>
</html>
